<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>304</title>
  <meta name="description" content="Play 304, the Sri Lankan four-player trick-taking card game, and read the house rules.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    // Keep the keys in sync with src/theme/theme.ts.
    (function () {
      try {
        var t = localStorage.getItem('304-theme'), m = localStorage.getItem('304-mode');
        if (t) document.documentElement.setAttribute('data-theme', t);
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-mode', m);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
